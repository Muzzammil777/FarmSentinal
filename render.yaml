services:
  # Static Site Deployment for React Frontend Dashboard
  - type: static
    name: farmsentinal-dashboard
    repo: https://github.com/Muzzammil777/FarmSentinal
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://farmsentinal-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Web Service Deployment for Python FastAPI Backend Bridge
  - type: web
    name: farmsentinal-backend
    env: python
    repo: https://github.com/Muzzammil777/FarmSentinal
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
