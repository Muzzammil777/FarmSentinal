services:
  # Static Site Deployment for Frontend
  - type: static
    name: farmsentinal-dashboard
    repo: https://github.com/Muzzammil777/FarmSentinal
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Web Service Deployment for Python FastAPI Backend
  - type: web
    name: farmsentinal-backend
    env: python
    repo: https://github.com/Muzzammil777/FarmSentinal
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
